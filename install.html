<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Zainstaluj Pompki</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #000; color: #fff; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); text-align: center; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { margin: 20px 0 12px; font-size: 32px; }
    p { line-height: 1.55; color: #ddd; }
    button { width: 100%; min-height: 56px; margin: 16px 0; border: 0; border-radius: 16px; background: #f77822; color: #000; font: 700 19px system-ui, sans-serif; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    #install-status { min-height: 96px; }
    a { display: inline-block; padding: 12px; color: #fff; }
    small { display: block; margin-top: 20px; color: #999; }
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="" width="96" height="96">
    <h1>Zainstaluj Pompki</h1>
    <p>Użyj przycisku na tej stronie. Gdy pojawi się okno Chrome, potwierdź instalację.</p>
    <button id="install" type="button">Zainstaluj Pompki</button>
    <p id="install-status" role="status" aria-live="polite">Stuknij przycisk i pozostaw tę stronę otwartą przez około 30 sekund, aby Chrome mógł przygotować instalację.</p>
    <a href="./">Przejdź do Pompki</a>
    <small>vGPT_1.0.4</small>
    <noscript><p>Włącz JavaScript, aby użyć przycisku instalacji.</p></noscript>
  </main>
  <script>
    /* Pompki vGPT_1.0.4 — separate installation flow; no workout or synchronization access. */
    (function () {
      'use strict';
      const button = document.getElementById('install');
      const status = document.getElementById('install-status');
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      let deferredPrompt = null, busy = false, accepted = false;
      const pendingMessage = 'Chrome zaakceptował instalację. Poczekaj na ikonę Pompki, a następnie otwórz ją.';
      const waitingTimer = setTimeout(() => {
        if (!deferredPrompt && !accepted && !standalone && !busy) {
          status.textContent = 'Chrome nie udostępnił jeszcze okna instalacji. Stuknij przycisk i poczekaj. Jeśli okno nadal się nie pojawia, przekaż ten komunikat.';
        }
      }, 45000);

      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        if (accepted || standalone) return;
        clearTimeout(waitingTimer);
        deferredPrompt = event;
        button.disabled = busy;
        status.textContent = 'Instalacja jest gotowa. Stuknij „Zainstaluj Pompki”.';
      });

      window.addEventListener('appinstalled', () => {
        clearTimeout(waitingTimer);
        accepted = true;
        deferredPrompt = null;
        button.disabled = true;
        status.textContent = pendingMessage;
      });

      button.addEventListener('click', async () => {
        if (busy || accepted || standalone) return;
        if (!deferredPrompt) {
          status.textContent = 'Czekamy na okno instalacji Chrome. Pozostaw tę stronę otwartą przez około 30 sekund; gdy instalacja będzie gotowa, stuknij przycisk ponownie.';
          return;
        }
        const prompt = deferredPrompt;
        deferredPrompt = null;
        busy = true;
        button.disabled = true;
        try {
          await prompt.prompt();
          const choice = await prompt.userChoice;
          if (choice.outcome === 'accepted' || accepted) {
            accepted = true;
            deferredPrompt = null;
            status.textContent = pendingMessage;
          } else {
            status.textContent = deferredPrompt
              ? 'Instalację anulowano. Możesz stuknąć przycisk ponownie.'
              : 'Instalację anulowano. Poczekaj na ponowne przygotowanie okna albo odśwież tę stronę, aby spróbować ponownie.';
          }
        } catch {
          if (!accepted) status.textContent = 'Nie udało się otworzyć okna instalacji. Odśwież tę stronę i spróbuj ponownie.';
        } finally {
          busy = false;
          button.disabled = accepted;
        }
      });

      if (standalone) {
        clearTimeout(waitingTimer);
        button.disabled = true;
        status.textContent = 'Ta strona działa już w zainstalowanej aplikacji Pompki.';
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' }).catch(() => {
          if (!accepted && !standalone && !deferredPrompt) status.textContent = 'Nie udało się przygotować aplikacji do pracy offline. Sprawdź połączenie i odśwież tę stronę.';
        });
      }
    })();
  </script>
</body>
</html>
